[package]
name = "cron-union"
version = "1.0.3"
edition = "2024"
description = "Merge multiple cron expressions into one deduped schedule"
repository = "https://github.com/moadim-io/cron-union"
homepage = "https://github.com/moadim-io/cron-union"
readme = "README.md"
license = "MIT"
keywords = ["cron", "schedule", "union"]
categories = ["algorithms"]

[lints.clippy]
missing_errors_doc = "warn"

[dependencies]
cron = "0.17.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cron_union"
harness = false
